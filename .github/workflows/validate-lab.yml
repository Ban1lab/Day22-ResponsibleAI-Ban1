name: validate-lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile validator and tests
        run: python -m py_compile scripts/validate-lab.py tests/test_validate_lab.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate completed example
        run: python scripts/validate-lab.py examples/hr-hiring
      - name: Validate committed submissions
        shell: bash
        run: |
          for submission in submissions/*; do
            if [[ -d "$submission" ]]; then
              python scripts/validate-lab.py "$submission"
            fi
          done
